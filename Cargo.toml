[workspace]
resolver = "3"
members = [
    "lib-remote-computers/io-utils",
    "lib-remote-computers/io-utils/macros/*",
    "lib-remote-computers/lib-mission",
    "lib-remote-computers/pss-drivers",
    "lib-remote-computers/sequences",
    "rfs-computer/rfs-computer",
    "rfs-computer/uremote-electronics",
    "rfs-computer/controllino",
    "rfs-computer/keller23sx",
    "rfs-computer/lox-fill-valve",
    "rfs-computer/tokio-modbus-shared",
    "flight-computer/flight-computer",
    "flight-computer/rfs-drivers",
    "flight-computer/asteria-gnc/gnc-interface",
    "flight-computer/asteria-gnc/gnc-configurations",
    "data-definitions/can-hal",
    "data-definitions/core",
    "data-definitions/datapoints/*",
    "data-definitions/datatypes",
    "data-definitions/macro-gated-derive",
    "data-definitions/macros",
    "data-definitions/mavlink-hal",
    "data-definitions/messages",
    "sequence-parser",
]

exclude = [
    "flight-computer/dpr-tuner"
]

[workspace.lints.clippy]
unwrap_used = "deny"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"         # Important, but the needing a section is not always pretty.
missing_panics_doc = "allow"         # Functions shouldn't panic, if contain panic code, it should be unreachable
ignored_unit_patterns = "allow"      # Not clearer to me
must_use_candidate = "allow"         # Not all `new` calls are problematic to not use
implicit_hasher = "allow"            # We'll only ever use the default hasher
doc_markdown = "allow"               # Too many false positives for acronymes I can't bother to whitelist
duration-suboptimal-units = "allow"  # Don't want to bump MSRV yet
unsafe_derive_deserialize = "allow"  # Appears when serde and facet are both derived
map_unwrap_or = "allow"              # Suggests `map_or_default` which would raise MSRV
[workspace.lints.rustdoc]
private_intra_doc_links = "allow"    # We don't export our docs

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"], default-features = false }
bincode = { version = "2.0.1", features = ["derive", "serde"], default-features = false }
defmt = { version = "1.0.1" }
arbitrary = { version = "1.4.1", features = ["derive"] }
utoipa = { version = "5.4.0" }
facet = { version = "0.46.0" }
# for GNC:
nav-types = { git = "https://github.com/nordmoen/nav-types.git", rev = "0b69095" }

[patch.crates-io]
ur20 = { git = "https://github.com/slowtec/ur20", rev = "592771d18d547e100aacd7204e65bf7d989910ac" }
