[package]
name = "lib-mission"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
io-utils = { path = "../io-utils" }
async-trait = "0.1.83"
thiserror = "1.0.64"
serde = { version = "1.0", features = ["derive"] }
watchable = "1.1.2"
tracing = "0.1.41"
tokio = { version = "1.40.0", features = ["sync", "fs", "rt"] }
mavio = { version = "0.5.10", features = ["std", "tokio"] }
messages = { path = "../../data-definitions/messages", features = [
    "derive_debug",
    "mavlink",
], default-features = false }
mavlink-hal = { path = "../../data-definitions/mavlink-hal" }
can-hal = { path = "../../data-definitions/can-hal", optional = true }
datatypes = { path = "../../data-definitions/datatypes", features = ["derive_serde"] } # for the traits
embedded-can = { version = "0.4.1", optional = true }
hex = "0.4.3"

# Util
fs4 = { version = "0.9", features = ["tokio"] }
tracing-subscriber = { version = "0.3.19", features = ["json", "env-filter"] }
csv-async = "1.3.0"
tokio-util = { version = "0.7.13", features = ["compat"] }
toml = "0.8.19"
sha1 = "0.11.0"
chrono = { version = "0.4.42", default-features = false, features = [
    "now",
    "clock",
] }
thread-priority = "3.0.0"

[dev-dependencies]
mockall = "0.13.1"
tokio = { version = "1.40.0", features = ["full"] }
toml = "0.8.20"

[features]
default = ["can"]
can = ["dep:embedded-can", "dep:can-hal", "messages/can"]
