[package]
name = "lib-mission"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
async-trait = "0.1.83"
thiserror = "1.0.64"
serde = { version = "1.0", features = ["derive"] }
watchable = "1.1.2"
tracing = "0.1.41"
tokio = { version = "1.40.0", features = ["sync", "fs", "rt"] }
hermes-mavlink = { path = "../hermes-mavlink" }
mavlink-core = { version = "0.13.1" }
hermes-can = { path = "../hermes-can", features = [
    "all",
], optional = true, version = "0.3.1" }
embedded-can = { version = "0.4.1", optional = true }
hex = "0.4.3"

# Util
fs4 = { version = "0.9", features = ["tokio"] }
tracing-subscriber = { version = "0.3.19", features = ["json", "env-filter"] }
csv-async = "1.3.0"
tokio-util = { version = "0.7.13", features = ["compat"] }
toml = "0.8.19"
sha2 = "0.10.8"
chrono = { version = "0.4.42", default-features = false, features = [
    "now",
    "clock",
] }

[dev-dependencies]
mockall = "0.13.1"
tokio = { version = "1.40.0", features = ["full"] }
toml = "0.8.20"

[features]
default = ["can"]
can = ["dep:hermes-can", "dep:embedded-can"]
