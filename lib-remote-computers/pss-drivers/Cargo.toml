[package]
name = "pss-drivers"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
watchable = "1.1.2"
lib-mission = { path = "../lib-mission" }
messages = { path = "../../data-definitions/messages", features = ["can"] }
datatypes = { path = "../../data-definitions/datatypes" }
tracing = "0.1.41"
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.45.1", features = ["time", "rt"] }


#util
csv-async = "1.3.0"
anyhow = "1"
futures-util = "0.3"
# Cargo.toml
tokio-util = { version = "0.7", features = ["compat"] }