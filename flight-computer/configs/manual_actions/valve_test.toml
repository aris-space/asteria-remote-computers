# This state machine config can alternate between a safe state and fully controllable manual state.

system_time_rate_hz = 10

[state_machine]
name = "PSS Valve Testing state machine"
initial_state = "Idle"

[telemetry]
mavlink_address = "127.0.0.1:5760"

[telemetry.downlink_rates]
# slowened telemetry.
state_hz = 0.5
kinematics_hz = 1
av_stack_data_hz = 0.5
steering_data_hz = 1
actuator_feedback_hz = 2
temperature_sensors_hz = 3
pressure_sensors_hz = 15
fill_levels_hz = 0.5
[can]
socket_address = "can0"
ecu_thrust_curve = []

[state_machine.states."Idle"]
type = "Waiting"
manual_transitions = [
    { target = "Control", display = "Activate", abort = false },
]

[state_machine.states."Control"]
type = "ManualControl"
allowed_actuators = [
    "prz_copv_vnt", # Pressurization Vent Valve, 0 (closed) or 1 (open)
    "prz_fss_dpr", # Fuel Pressurization Valve (DPR), NaN (disabled) or 0-60 barg
    "fss_tnk_vnt", # Fuel Vent Valve, 0 (closed) or 1 (open)
    "prz_oss_dpr", # Oxidizer Pressurization Valve (DPR), NaN (disabled) or 0-60 barg
    "oss_tnk_vnt", # Oxidizer Vent Valve, 0 (closed) or 1 (open)
    "fss_ml_vlv", # Fuel Main Valve, 0 (closed) to 1 (open)
    "oss_ml_vlv", # Oxidizer Main Valve, 0 (closed) to 1 (open)
]
manual_transitions = [
    { target = "Idle", display = "Deactivate", abort = false },
]
