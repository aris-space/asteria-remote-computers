# This config just instantly arms the recovery board and triggers safety spiral.

system_time_rate_hz = 10

[telemetry]
mavlink_address = "127.0.0.1:5760"

[telemetry.downlink_rates]
# slowened telemetry.
state_hz = 0.5
kinematics_hz = 5
av_stack_data_hz = 0.5
steering_data_hz = 5
actuator_feedback_hz = 2
temperature_sensors_hz = 3
pressure_sensors_hz = 15
fill_levels_hz = 0.5
[can]
socket_address = "can0"
ecu_thrust_curve = []

[state_machine]
name = "Testing the hook release motors"
initial_state = "Arm"

[state_machine.states."Arm"]
type = "ArmRecovery"
arming_state = "Armed"
on_state_set = "Wait for Armed"

[state_machine.states."Wait for Armed"]
type = "HeightOrTimeTrigger"
on_time_limit_reached = "Safety Spiral"
on_height_limit_reached = "Safety Spiral"
time_limit_sec = 0.5
height_limit_m = -10.0

[state_machine.states."Safety Spiral"]
type = "SafetySpiral"
# Motor positions are expressed in full revolutions
motors_pull_value_rev = [-2.37, 1.192]
on_motors_pulled = "Safety Spiral 2"
[state_machine.states."Safety Spiral 2"]
type = "AwaitTimer"
# Wait ten minutes and assume it's safe to recover
duration_sec = 600
on_timer = "Disarm"
manual_transitions = [{ target = "Disarm", display = "Manual Disarm" }]

[state_machine.states."Disarm"]
type = "ArmRecovery"
arming_state = "Unarmed"
on_state_set = "Shutdown"

[state_machine.states."Shutdown"]
type = "Shutdown"
