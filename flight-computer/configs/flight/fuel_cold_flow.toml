# Vertical Integrated Firing

# ======================================= System configuration =======================================
system_time_rate_hz = 100
[telemetry]
mavlink_address = "127.0.0.1:5760"
[can]
socket_address = "can0"
[state_machine]
name = "Launch State Machine"
initial_state = "Idle"

# Path to the state machine diagram SVG which is used by the mission control.
# **Note**: This path is relative to the root of the repository.
diagram_path = "state-machines/fc-vif-state-machine.drawio.svg"

# ======================================= Preparation =======================================

# State machine's starting point. Simply waits for a manual command.
[state_machine.states."Idle"]
type = "Waiting"
manual_transitions = [{ target = "Diagnostics" }, { target = "Valve Check" }]

# This state exists for recovering from failures that can happen before liftoff
[state_machine.states."Soft Failure"]
type = "Waiting"
manual_transitions = [{ target = "Idle" }]

# This state continues only when all boards have sent healthy reports
[state_machine.states."Diagnostics"]
type = "Diagnostics"
on_tests_pass = "Valve Check"
on_tests_fail = "Soft Failure"
outdated_threshold_sec = 5
check_pss_boards = true

# This state allows full actuators control for system functionality checks
[state_machine.states."Valve Check"]
type = "ManualControl"
allowed_actuators = [
    "prz_copv_vnt",
    "prz_fss_dpr",
    "fss_tnk_vnt",
    "prz_oss_dpr",
    "oss_tnk_vnt",
    "fss_ml_vlv",
    "oss_ml_vlv",
]
manual_transitions = [
    { target = "Waiting for Handsoff" },
    { target = "Soft Failure", abort = true },
]

# In this state the rocket is transported to the pad and we wait before continueing further
[state_machine.states."Waiting for Handsoff"]
type = "SetNormalState"
on_done = "Waiting for Handsoff 2"
[state_machine.states."Waiting for Handsoff 2"]
type = "ArmRecovery"
arming_state = "SteeringMotorsLocked"
on_state_set = "Waiting for Handsoff 3"
[state_machine.states."Waiting for Handsoff 3"]
type = "Waiting"
manual_transitions = [
    { target = "Passive for Filling" },
    { target = "Soft Failure", abort = true },
]

# ======================================= Passive =======================================


# A state to reset to from the passive state.
[state_machine.states."Force Abort"]
type = "Waiting"
manual_transitions = [
    { target = "Waiting for Handsoff" },
    { target = "Override Valves" },
]

# A state to potentially fix a broken system during an off-nominal scenario.
[state_machine.states."Override Valves"]
type = "ManualControl"
allowed_actuators = [
    "prz_copv_vnt",
    "prz_fss_dpr",
    "fss_tnk_vnt",
    "prz_oss_dpr",
    "oss_tnk_vnt",
    "fss_ml_vlv",
    "oss_ml_vlv",
]
manual_transitions = [{ target = "Force Abort" }]

# This will set all valves inactive, essentially venting any pressure.
# Used as the abort during filling, if connection is lost.
[state_machine.states."Vent"]
type = "SetNormalState"
on_done = "Vent 2"
[state_machine.states."Vent 2"]
type = "Waiting"
manual_transitions = [{ target = "Force Abort" }]

# The state in which the FC is passive while the RFSC coordinates filling the rocket
[state_machine.states."Passive for Filling"]
type = "WaitWhileConnected"
rfs_can_timeout_sec = 900.0
on_timeout = "Vent"
manual_transitions = [
    { target = "Force Abort", abort = true },
    { target = "Gate" },
    { target = "Takeover" },                  # Skipping Diagnostics
]

# This state continues only when all boards have sent healthy reports
[state_machine.states."Gate"]
type = "Diagnostics"
on_tests_pass = "Takeover"
on_tests_fail = "Boards Unhealthy"
outdated_threshold_sec = 5
check_pss_boards = true
check_separation = false           # FIXME: Enable for Flight!
check_main_chute = false           # FIXME: Enable for Flight!

# This abort state requires the operator to acknowledge that some boards are unhealthy.
[state_machine.states."Boards Unhealthy"]
type = "WaitWhileConnected"
rfs_can_timeout_sec = 900.0
on_timeout = "Vent"
manual_transitions = [
    { target = "Force Abort", abort = true },
    { target = "Passive for Filling" },
]


# ======================================= Pressurization =======================================


# Abort state which just stops any ongoing pressurization, but only vents tanks, not the COPV yet
[state_machine.states."Stop Pressurization"]
type = "ArmRecovery"                   # Also propagated to RFS
arming_state = "SteeringMotorsLocked"
on_state_set = "Stop Pressurization 3"
[state_machine.states."Stop Pressurization 3"]
type = "SetActuators"
# Close DPR valves & open Vent
targets = { "prz_fss_dpr" = "DPRDisabled", "prz_oss_dpr" = "DPRDisabled", "fss_tnk_vnt" = "Open", "oss_tnk_vnt" = "Open" }
on_done = "Stop Pressurization 4"
[state_machine.states."Stop Pressurization 4"]
type = "Waiting"
manual_transitions = [{ target = "Takeover" }, { target = "Override Valves P" }]

# A state to potentially fix a broken system during an off-nominal scenario.
[state_machine.states."Override Valves P"]
type = "ManualControl"
allowed_actuators = [
    "prz_copv_vnt",
    "prz_fss_dpr",
    "fss_tnk_vnt",
    "prz_oss_dpr",
    "oss_tnk_vnt",
    "fss_ml_vlv",
    "oss_ml_vlv",
]
manual_transitions = [{ target = "Stop Pressurization" }]

# Abort state which depressurizes the entire system, including COPV.
[state_machine.states."Depressure"]
type = "ArmRecovery"                  # Also propagated to RFS
arming_state = "SteeringMotorsLocked"
on_state_set = "Depressure 2"
[state_machine.states."Depressure 2"]
type = "SetNormalState"
on_done = "Depressure 3"
[state_machine.states."Depressure 3"]
type = "Waiting"
manual_transitions = [{ target = "Manual Safeing" }]

# This state marks the transition to pressurization section, where the rocket is in its own control again
[state_machine.states."Takeover"]
type = "Waiting"
manual_transitions = [
    { target = "Pressurization" },
    { target = "Stop Pressurization", abort = true },
]

# This state allows manual pressurization
[state_machine.states."Pressurization"]
type = "MonitoredManualControl"
allowed_actuators = ["prz_fss_dpr", "fss_tnk_vnt", "prz_oss_dpr", "oss_tnk_vnt"]
telemetry_loss_threshold_sec = 900 # 15min
on_violation = "Stop Pressurization"
on_telemetry_loss = "Depressure"
manual_transitions = [
    { target = "Pressurized" },
    { target = "Stop Pressurization", abort = true },
]
[state_machine.states."Pressurization".thresholds.upper_thresholds_barg]
fuel_tank_pressure = 54
oxitizer_tank_pressure = 54


# This state is reached when the tanks have reached the required pressures and is one step away from arming.
[state_machine.states."Pressurized"]
type = "ArmRecovery"
arming_state = "SteeringMotorsLocked"
on_state_set = "Pressurized 2"
[state_machine.states."Pressurized 2"]
type = "MonitoredWaiting"
on_violation = "Stop Pressurization"
on_telemetry_loss = "Depressure"
telemetry_loss_threshold_sec = 900 # 15min
manual_transitions = [
    { target = "Armed" },
    { target = "Stop Pressurization", abort = true },
]
[state_machine.states."Pressurized 2".thresholds.upper_thresholds_barg]
fuel_tank_pressure = 54
oxitizer_tank_pressure = 54

# This state will arm the recovery motors and allow the RFS to arm its software such that the ECU will be able to control ignition.
[state_machine.states."Armed"]
type = "ArmRecovery"
arming_state = "Armed"
on_state_set = "Armed 2"
[state_machine.states."Armed 2"]
type = "CameraPowerControl"
camera_power_state = "On"
on_state_set = "Armed 3"
[state_machine.states."Armed 3"]
type = "MonitoredWaiting"
on_violation = "Stop Pressurization"
on_telemetry_loss = "Depressure"
telemetry_loss_threshold_sec = 900 # 15min
manual_transitions = [
    { target = "Pressurized" },
    { target = "Ignition Initiation" },
    { target = "Stop Pressurization", abort = true },
]
[state_machine.states."Armed 3".thresholds.upper_thresholds_barg]
fuel_tank_pressure = 54
oxitizer_tank_pressure = 54

# This state exists for acknowledging that the RFS was not armed upon the ignition command
[state_machine.states."Auto-Disarmed"]
type = "ArmRecovery"
arming_state = "SteeringMotorsLocked"
on_state_set = "Auto-Disarmed 2"
[state_machine.states."Auto-Disarmed 2"]
type = "MonitoredWaiting"
telemetry_loss_threshold_sec = 900 # 15min
on_violation = "Stop Pressurization"
on_telemetry_loss = "Depressure"
manual_transitions = [
    { target = "Pressurized" },
    { target = "Stop Pressurization", abort = true },
]
[state_machine.states."Auto-Disarmed 2".thresholds.upper_thresholds_barg]
fuel_tank_pressure = 54
oxitizer_tank_pressure = 54

# This state allows full actuators control for system safeing operations
# This is a terminal state, there is no way out
[state_machine.states."Manual Safeing"]
type = "ManualControl"
allowed_actuators = [
    "prz_copv_vnt",
    "prz_fss_dpr",
    "fss_tnk_vnt",
    "prz_oss_dpr",
    "oss_tnk_vnt",
    "fss_ml_vlv",
    "oss_ml_vlv",
]
manual_transitions = [{ target = "Pressurized" }]


# ======================================= Ignition =======================================

# This state runs if the firing sequence or a manual input aborted
# Sets PSS normal state and igniter off, with purging on.
[state_machine.states."Firing Abort"]
type = "SetNormalState"
on_done = "Firing Abort 2"
[state_machine.states."Firing Abort 2"]
type = "RunSequence"
on_completed = "Firing Abort 3"
sequence = """
# Igniter off
h2_ign_vlv.close();
gox_ign_vlv.close();
ign_spk_plg.close();
# Purge on
gox_prg_vlv.open();
h2_prg_vlv.open();
eng_prg_vlv.open();
"""
manual_transitions = [{ target = "Manual Safeing" }]
[state_machine.states."Firing Abort 3"]
type = "Waiting"
manual_transitions = [{ target = "Manual Safeing" }]

# This instantaneous state ensures that the RFS is armed for ignition
[state_machine.states."Ignition Initiation"]
type = "ReadRFSArming"
on_armed = "Ignition"
on_not_armed = "Auto-Disarmed"

# The state sends the engine start signal and waits for liftoff
[state_machine.states."Ignition"]
type = "RunSequence"
on_completed = "Purging"
sequence = """
# Pre-Conditions:
# Vent Valves Closed, Tanks Pressurized to 5 barg
# Rocket Purge Open, Igniter Purge Open

eng_prg_vlv.close();
sys.wait(time=1s);

# Start Sys ID ColdFlow FSS

prz_fss_dpr.activate(setpoint=5.0);
fss_ml_vlv.open();
sys.wait(time=2s);

prz_fss_dpr.activate(setpoint=10.0);
fss_ml_vlv.open();
sys.wait(time=2s);

prz_fss_dpr.activate(setpoint=15.0);
fss_ml_vlv.open();
sys.wait(time=2s);

prz_fss_dpr.activate(setpoint=20.0);
fss_ml_vlv.open();
sys.wait(time=2s);

prz_fss_dpr.activate(setpoint=25.0);
fss_ml_vlv.open();
sys.wait(time=2s);

# Shutdown
fss_ml_vlv.close();

prz_oss_dpr.deactivate();
prz_fss_dpr.deactivate();

fss_tnk_vnt.open();
oss_tnk_vnt.open();

# Post Conditions:
# Tanks still depressurizing, DPRs closed
# Rocket Purge will be initiated from next state (purging)
"""
manual_transitions = [{ target = "Firing Abort", abort = true }]

# The state sends the engine start signal and waits for liftoff
[state_machine.states."Purging"]
type = "RunSequence"
on_completed = "Purging 2"
sequence = """
eng_prg_vlv.open();
"""
[state_machine.states."Purging 2"]
type = "Waiting"
manual_transitions = [{ target = "Safeing Normal" }]

# This state sets the system in a known state before manual safeing
[state_machine.states."Safeing Normal"]
type = "SetNormalState"
on_done = "Safeing Normal 2"
[state_machine.states."Safeing Normal 2"]
type = "Waiting"
manual_transitions = ["Safeing Idle"]

# This state allows no valve control during human interactions.
[state_machine.states."Safeing Idle"]
type = "Waiting"
manual_transitions = ["Safeing Normal", "Safeing Controllable"]

# This state allows full valve control of all RFS actuators for safeing purposes.
[state_machine.states."Safeing Controllable"]
type = "ManualControl"
allowed_actuators = [
    "prz_copv_vnt",
    "prz_fss_dpr",
    "fss_tnk_vnt",
    "prz_oss_dpr",
    "oss_tnk_vnt",
    "fss_ml_vlv",
    "oss_ml_vlv",
]
manual_transitions = [
    "Safeing Idle",
    { target = "Safeing Normal", abort = true },
]
