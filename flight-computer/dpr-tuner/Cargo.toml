[package]
name = "dpr-tuner"
version = "0.1.0"
edition = "2024"

[dependencies]
messages = { path = "../../data-definitions/messages", features = [
    "can",
    "derive_debug",
] }
can-hal = { path = "../../data-definitions/can-hal" }
dp-fuel-control-board = { path = "../../data-definitions/datapoints/dp-fuel-control-board", features = [
    "can",
    "derive_debug",
] }
dp-oxidizer-control-board = { path = "../../data-definitions/datapoints/dp-oxidizer-control-board", features = [
    "can",
    "derive_debug",
] }
datatypes = { path = "../../data-definitions/datatypes" }
embedded-can = "0.4.1"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }

[target.'cfg(target_os = "linux")'.dependencies]
socketcan = "3.5.0"
