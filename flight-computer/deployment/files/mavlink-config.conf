[General]

# Enable forwarding between endpoints (can probably be removed, since it should be true per default)
Forwarding = True

TcpServerPort = 5766

# -------------------------------------
# UDP ENDPOINT DEFINITIONS
# -------------------------------------

# Endpoint for the flight computer connection
[UdpEndpoint flight_computer]
Mode = Server
Address = 127.0.0.1
Port = 5760

# Local endpoint that can be used for connecting debugging tools
# [UdpEndpoint local_endpoint]
# Mode = Server
# Address = 127.0.0.1
# Port = 6000

# Endpoint for the mission control mavlink router connection via UDP
[UdpEndpoint mission_control]
Mode = Server
Address = 0.0.0.0
Port = 5000
Group = mission_control

# Endpoint for the mission control mavlink router connection via UART
[UartEndpoint mission_control]
Device=/dev/ttyAMA3
Baud=115200
Group = mission_control
