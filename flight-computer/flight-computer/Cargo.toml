[package]
name = "flight-computer"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[dependencies]
lib-mission = { path = "../../lib-remote-computers/lib-mission" }
gnc_interface = { path = "../hermes-recovery-gnc/gnc_interface" }
hermes_gnc = { path = "../hermes-recovery-gnc/hermes_gnc", optional = true }
datatypes = { path = "../../data-definitions/datatypes", features = ["std"] }
messages = { path = "../../data-definitions/messages", features = [
    "derive_debug",
], default-features = false }
pss-drivers = { path = "../../lib-remote-computers/pss-drivers" }
tokio = { version = "1.37.0", features = ["full"] }
watchable = "1.1.2"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8.19"
thiserror = "1.0.64"
async-trait = "0.1.83"
tracing = "0.1.41"
mavlink-core = { version = "0.13.1" }
nalgebra = "0.33.2"

[target.'cfg(target_os = "linux")'.dependencies]
socketcan = "3.5.0"
rppal = "0.22.1"

[build-dependencies]
built = { version = "0.7.7", features = ["git2"] }

[features]
default = ["gnc"]
gnc = ["dep:hermes_gnc"]

[dev-dependencies]
glob = "0.3.2"
