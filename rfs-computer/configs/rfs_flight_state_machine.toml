# The RFSC flight state machine

# ======================================= System Configuration =======================================
system_time_rate_hz = 200
[telemetry]
mavlink_address = "127.0.0.1:5761"
always_allowed_actuators = [
    "maxon_board_power",
    "rocket_power",
    "rocket_heating",
    "custom1",
    "custom2",
    "custom3",
]
[uremote]
address = "192.168.0.222:502"
min_read_frequency_hz = 20
[serial]
serial_port = "/dev/ttyAMA2"
baud_rate = "Baud115200"
timeout_ms = 105
pressure_polling_hz = 20
valve_state_polling_hz = 5
[can]
socket_address = "can0"
[controllino]
address = "192.168.0.227:502"
request_timeout_secs = 0.1
pressure_polling_hz = 40.0
temperature_polling_hz = 5.0
digital_polling_hz = 10.0
actuator_polling_hz = 10.0


# ======================================= System Test =======================================
[state_machine]
name = "Flight State machine, Dry Run"
initial_state = "Idle"

# Path in the repo to the state machine diagram to be used by mission control.
diagram_path = "state-machines/rfs-flight-state-machine.drawio.svg"

# Initial state which does nothing
[state_machine.states."Idle"]
type = "Waiting"
manual_transitions = [
    { target = "Diagnostics", display = "Startup" },
    { target = "System Normal", display = "Skip Diagnostics" }, # Should only be used carefully
]

# This state exists for acknowledging diagnostic failures
[state_machine.states."Soft Failure"]
type = "Waiting"
manual_transitions = [{ target = "Idle", display = "Restart" }]

# This state only lets the SM pass on if all sensors are reading good values
[state_machine.states."Diagnostics"]
type = "DiagnosticsGate"
on_tests_pass = "System Normal"
on_tests_fail = "Soft Failure"

# Abort state during system testing, which sets all (but the lox bleed) valves in a normal state, designed to depressurize the system.
[state_machine.states."Safe Abort"]
type = "DepressurizeRFS"
on_done = "Safe Abort 2"
[state_machine.states."Safe Abort 2"]
type = "Waiting"
manual_transitions = [{ target = "System Normal", display = "Reset" }]

# This state is compose of substates and sets the system in a known state before waiting
[state_machine.states."System Normal"]
type = "SetNormalState"
on_done = "System Normal 3"
[state_machine.states."System Normal 3"]
type = "Waiting"
manual_transitions = [
    { target = "System Idle", display = "Idle" },
    { target = "Ready for Takeover", display = "Ready for Takeover" },
    { target = "Safe Abort", display = "Depressurize", abort = true },
]

# This state allows no valve control during human interactions.
[state_machine.states."System Idle"]
type = "Waiting"
manual_transitions = [
    { target = "System Normal", display = "Normal" },
    { target = "System Controllable", display = "Unlock" },
    { target = "Safe Abort", display = "Depressurize", abort = true },
]

# This state allows full valve control of all RFS actuators for testing procedures.
[state_machine.states."System Controllable"]
type = "ManualControl"
allowed_actuators = [
    "lox_fll_vlv", # LOx fill valve
    "gox_prg_vlv", # GOx purge valve
    "h2_prg_vlv",  # H2 purge valve
    "n2_bld_vlv",  # N2 bleed valve
    "lox_prg_vlv", # LOx purge valve
    "gox_bld_vlv", # GOx bleed valve
    "n2_prg_vlv",  # N2 purge valve
    "n2_fll_vlv",  # N2 fill valve
    "h2_bld_vlv",  # H2 bleed valve
    "lox_bld_vlv", # LOx bleed valve
    "n2_bst_vlv",  # Booster valve
    "lox_dec_ext", # LOX decoupler
    "lox_dec_ret", # LOX decoupler
    "n2_dec_ext",  # N2 decoupler
    "n2_dec_ret",  # N2 decoupler
    "n2_shw_vlv",  # N2 shower valves
    "h2_ign_vlv",  # H2 igniter valve
    "gox_ign_vlv", # GOx igniter valve
    "ign_spk_plg", # Igniter spark
]
manual_transitions = [
    { target = "System Idle", display = "Lock" },
    { target = "Igniter Test", display = "Start Igniter Test" },
    { target = "Safe Abort", display = "Depressurize", abort = true },
]

# This state runs the igniter test sequence to test ignition.
[state_machine.states."Igniter Test"]
type = "RunSequence"
on_completed = "System Controllable"
on_cancelled = "Abort Ign Test"
manual_transitions = [
    { target = "Abort Ign Test", display = "Abort", abort = true },
]
[state_machine.states."Igniter Test".thresholds.upper_thresholds_barg]
gox = 15
h2 = 15
igniter = 10
[state_machine.states."Igniter Test".thresholds.upper_thresholds_celsius]
igniter = 200
# Start purging
[[state_machine.states."Igniter Test".sequence]]
action = "SetActuators"
targets = { "gox_prg_vlv" = "Open", "h2_prg_vlv" = "Open" }
# Purge
[[state_machine.states."Igniter Test".sequence]]
action = "Wait"
duration_sec = 5
# Stop purging and start spark plug
[[state_machine.states."Igniter Test".sequence]]
action = "SetActuators"
targets = { "gox_prg_vlv" = "Close", "h2_prg_vlv" = "Close", "ign_spk_plg" = "On" }
[[state_machine.states."Igniter Test".sequence]]
action = "Wait"
duration_sec = 0.5
# First open GOX then H2 valve
[[state_machine.states."Igniter Test".sequence]]
action = "SetActuators"
targets = { "gox_ign_vlv" = "Open" }
[[state_machine.states."Igniter Test".sequence]]
action = "Wait"
duration_sec = 0.5
[[state_machine.states."Igniter Test".sequence]]
action = "SetActuators"
targets = { "h2_ign_vlv" = "Open" }
# Detect firing, analogous to `igniter_pres.detect(value=6, rising=true, abort=ign_abort, patience=1s);`
[[state_machine.states."Igniter Test".sequence]]
action = "IgnitionDetection"
pressure_lower_thresh_barg = 6.0
patience_sec = 1.0
# Sustain firing, abort if pressure becomes too low
[[state_machine.states."Igniter Test".sequence]]
action = "SustainedIgnition"
min_pressure_barg = 5.0
duration_sec = 4.0
# After ignition purge sequence:
[[state_machine.states."Igniter Test".sequence]]
action = "SetActuators"
targets = { "gox_ign_vlv" = "Close", "h2_ign_vlv" = "Close", "gox_prg_vlv" = "Open", "h2_prg_vlv" = "Open" }
[[state_machine.states."Igniter Test".sequence]]
action = "Wait"
duration_sec = 0.5
[[state_machine.states."Igniter Test".sequence]]
action = "SetActuators"
targets = { "ign_spk_plg" = "Off" }
[[state_machine.states."Igniter Test".sequence]]
action = "Wait"
duration_sec = 5
[[state_machine.states."Igniter Test".sequence]]
action = "SetActuators"
targets = { "gox_prg_vlv" = "Close", "h2_prg_vlv" = "Close" }

# This runs the ignition abort sequence in case a manual or automatic abort was triggered
[state_machine.states."Abort Ign Test"]
type = "RunSequence"
on_completed = "Safe Abort"
on_cancelled = "Safe Abort"
manual_transitions = [
    { target = "Safe Abort", display = "Abort Abort Seq", abort = true },
]
# Open purge valves and close fuel valve
[[state_machine.states."Abort Ign Test".sequence]]
action = "SetActuators"
targets = { "h2_ign_vlv" = "Close", "gox_ign_vlv" = "Close", "gox_prg_vlv" = "Open", "h2_prg_vlv" = "Open" }
[[state_machine.states."Abort Ign Test".sequence]]
action = "Wait"
duration_sec = 0.5
# 0.5s later turn off spark plug
[[state_machine.states."Abort Ign Test".sequence]]
action = "SetActuators"
targets = { "ign_spk_plg" = "Off" }
# Now purge for 5 sec and then closed the purge valves again
[[state_machine.states."Abort Ign Test".sequence]]
action = "Wait"
duration_sec = 5
[[state_machine.states."Abort Ign Test".sequence]]
action = "SetActuators"
targets = { "gox_prg_vlv" = "Close", "h2_prg_vlv" = "Close" }

# ======================================= Takeover =======================================

# Abort state before ethanol filling, which sets all valves in a normal state
[state_machine.states."Pre Filling Abort"]
type = "SetNormalState"
on_done = "Pre Filling Abort 2"
[state_machine.states."Pre Filling Abort 2"]
type = "Waiting"
manual_transitions = [
    { target = "Ready for Takeover", display = "Force Reset" },
    { target = "PreF Abort Overrides", display = "Override" },
]

# This state allows full actuators control during safing operations in an abort scenario
[state_machine.states."PreF Abort Overrides"]
type = "ManualControl"
allowed_actuators = [
    "lox_fll_vlv",
    "gox_prg_vlv",
    "h2_prg_vlv",
    "n2_bld_vlv",
    "lox_prg_vlv",
    "gox_bld_vlv",
    "n2_prg_vlv",
    "n2_fll_vlv",
    "h2_bld_vlv",
    "lox_bld_vlv",
    "n2_bst_vlv",
    "lox_dec_ext",
    "lox_dec_ret",
    "n2_dec_ext",
    "n2_dec_ret",
    "n2_shw_vlv",
    "h2_ign_vlv",
    "gox_ign_vlv",
    "ign_spk_plg",
    "prz_copv_vnt",
    "prz_fss_dpr",
    "fss_tnk_vnt",
    "prz_oss_dpr",
    "oss_tnk_vnt",
    "fss_ml_vlv",
    "oss_ml_vlv",
]
manual_transitions = [{ target = "Pre Filling Abort", display = "Done" }]

# A state that waits for the FC to become passive
[state_machine.states."Ready for Takeover"]
type = "Waiting"
manual_transitions = [
    { target = "System Normal", display = "Cancel" },
    { target = "Pre Filling Abort", display = "Abort", abort = true },
    { target = "PSS Diagnostics" },
]

# This state only lets the SM pass on if all boards in the rocket are healthy
[state_machine.states."PSS Diagnostics"]
type = "PSSDiagnosticsGate"
outdated_threshold_sec = 5
on_tests_pass = "Takeover"
on_tests_fail = "PSS Unhealthy"

# This state lets the operator acknowledge that the connection to the rocket is unhealthy
[state_machine.states."PSS Unhealthy"]
type = "Waiting"
manual_transitions = [
    { target = "System Normal", display = "Retry" },
    { target = "Pre Filling Abort", display = "Abort", abort = true },
]

# This state takes control of the PSS system for the RFS and then waits
[state_machine.states."Takeover"]
type = "Waiting"
manual_transitions = [
    { target = "Couple", display = "Couple" },
    { target = "Pre Filling Abort", display = "Abort", abort = true },
]

# ======================================= Filling =======================================

# This state allows controlling the decoupling actuators for assisting the manual coupling operations
[state_machine.states."Couple"]
type = "ManualControl"
allowed_actuators = [
    "lox_dec_ext", # LOX decoupler
    "lox_dec_ret", # LOX decoupler
    "n2_dec_ext",  # N2 decoupler
    "n2_dec_ret",  # N2 decoupler
    "n2_prg_vlv",  # N2 purge valve
    "lox_prg_vlv", # LOX purge valve
    "n2_shw_vlv",  # N2 shower valves
]
manual_transitions = [
    { target = "Pre Filling Abort", display = "Abort", abort = true },
    { target = "Waiting for Filling", display = "Coupled" },
]

# This waiting state leaves the RFS to be while the rocket is erected and until we are GO for filling.
[state_machine.states."Waiting for Filling"]
type = "SetNormalState"
on_done = "Waiting for Filling 2"
[state_machine.states."Waiting for Filling 2"]
type = "RunSequence"
on_completed = "Waiting for Filling 3"
on_cancelled = "Waiting for Filling 3"
[[state_machine.states."Waiting for Filling 2".sequence]]
action = "SetActuators"
targets = { "n2_shw_vlv" = "Open" } # enforces that n2 shower valves is always open
[state_machine.states."Waiting for Filling 3"]
type = "Waiting"
manual_transitions = [
    { target = "Purge", display = "Purge" },
    { target = "Ethanol Filling", display = "Start Ethanol Filling" },
    { target = "Pre Filling Abort", display = "Abort", abort = true },
]


# This state runs the rocket purge sequence before filling in fuel.
[state_machine.states."Purge"]
type = "RunSequence"
on_completed = "Purge 2"
on_cancelled = "Purge 2" # Sequence contains no cancellable actions
manual_transitions = [
    { target = "Pre Filling Abort", display = "Abort", abort = true },
]
# Close n2 bleed, open n2 purge. Prz Vent and Fuel prz are already open/closed respectively.
[[state_machine.states."Purge".sequence]]
action = "SetActuators"
targets = { "n2_bld_vlv" = "Close", "n2_prg_vlv" = "Open", "prz_copv_vnt" = "Open", "prz_fss_dpr" = "DPRDisabled" }
# Purge pressure tank for 5 sec
[[state_machine.states."Purge".sequence]]
action = "Wait"
duration_sec = 5
# Open fuel prz valve and close prz Vent.
[[state_machine.states."Purge".sequence]]
action = "SetActuators"
targets = { "prz_copv_vnt" = "Close", "fss_tnk_vnt" = "Open", "prz_fss_dpr" = { "SetpointBarG" = 10.0 } }
# Purge fuel tank for 10 sec
[[state_machine.states."Purge".sequence]]
action = "Wait"
duration_sec = 10
# Close fuel vent and open main valve fully
[[state_machine.states."Purge".sequence]]
action = "SetActuators"
targets = { "fss_tnk_vnt" = "Close", "fss_ml_vlv" = "Open" }
# Purge fuel line for 5 sec
[[state_machine.states."Purge".sequence]]
action = "Wait"
duration_sec = 5
# Close FSS prz valve, but open OSS one.
[[state_machine.states."Purge".sequence]]
action = "SetActuators"
targets = { "prz_fss_dpr" = "DPRDisabled", "prz_oss_dpr" = { "SetpointBarG" = 10.0 } }
# Purge oxidizer tank for 10 sec
[[state_machine.states."Purge".sequence]]
action = "Wait"
duration_sec = 10
# Close n2 purge and reset rest to normal.
[state_machine.states."Purge 2"]
type = "SetNormalState"
on_done = "Purge 3"
[state_machine.states."Purge 3"]
type = "RunSequence"
on_completed = "Purge 4"
on_cancelled = "Purge 4" # Sequence contains no cancellable actions
manual_transitions = [
    { target = "Pre Filling Abort", display = "Abort", abort = true },
]
[[state_machine.states."Purge 3".sequence]]
action = "SetActuators"
targets = { "n2_prg_vlv" = "Close", "prz_oss_dpr" = "DPRDisabled", "prz_copv_vnt" = "Open", "fss_tnk_vnt" = "Open", "n2_bld_vlv" = "Open", "fss_ml_vlv" = "Close" }
[[state_machine.states."Purge 3".sequence]]
action = "Wait"
duration_sec = 0.4
# Now open lox purge
[[state_machine.states."Purge 3".sequence]]
action = "SetActuators"
targets = { "lox_prg_vlv" = "Open" }
# Purge lox decoupler line (?) for 5 sec
[[state_machine.states."Purge 3".sequence]]
action = "Wait"
duration_sec = 5
# Now open lox main, but close oss vent
[[state_machine.states."Purge 3".sequence]]
action = "SetActuators"
targets = { "oss_ml_vlv" = "Open", "oss_tnk_vnt" = "Close" }
# Purge lox main line  for 5 sec
[[state_machine.states."Purge 3".sequence]]
action = "Wait"
duration_sec = 5
# Open OSS vent, close OSS main, open lox fill valve to 100%
[[state_machine.states."Purge 3".sequence]]
action = "SetActuators"
targets = { "oss_tnk_vnt" = "Open", "oss_ml_vlv" = "Close", "lox_fll_vlv" = "Open" }
# Purge dewar flex pipe for 5 sec
[[state_machine.states."Purge 3".sequence]]
action = "Wait"
duration_sec = 5
# Reset back to normal
[[state_machine.states."Purge 3".sequence]]
action = "SetActuators"
targets = { "lox_prg_vlv" = "Close", "lox_fll_vlv" = "Close" }
[state_machine.states."Purge 4"]
type = "SetNormalState"
on_done = "Waiting for Filling"

# This waiting state lets humans fill in ethanol
[state_machine.states."Ethanol Filling"]
type = "Waiting"
manual_transitions = [
    { target = "Pre Chill", display = "Start Pre Chill" },
    { target = "Pre Filling Abort", display = "Abort", abort = true },
]

############ Transition into the Filling part ##############
# Abort state during filling, sets everything normal.
[state_machine.states."Filling Abort"]
type = "SetNormalState"
on_done = "Filling Abort 2"
[state_machine.states."Filling Abort 2"]
type = "Waiting"
manual_transitions = [
    { target = "Abort Overrides", display = "Override" },
    { target = "Pre Chill", display = "Reset" },
]

# This state allows full actuators control during safing operations in an abort scenario
[state_machine.states."Abort Overrides"]
type = "ManualControl"
allowed_actuators = [
    "lox_fll_vlv",
    "gox_prg_vlv",
    "h2_prg_vlv",
    "n2_bld_vlv",
    "lox_prg_vlv",
    "gox_bld_vlv",
    "n2_prg_vlv",
    "n2_fll_vlv",
    "h2_bld_vlv",
    "lox_bld_vlv",
    "n2_bst_vlv",
    "lox_dec_ext",
    "lox_dec_ret",
    "n2_dec_ext",
    "n2_dec_ret",
    "n2_shw_vlv",
    "h2_ign_vlv",
    "gox_ign_vlv",
    "ign_spk_plg",
    "prz_copv_vnt",
    "prz_fss_dpr",
    "fss_tnk_vnt",
    "prz_oss_dpr",
    "oss_tnk_vnt",
    "fss_ml_vlv",
    "oss_ml_vlv",
]
manual_transitions = [{ target = "Filling Abort", display = "Done" }]

# A state where the lox line can be pre chilled
[state_machine.states."Pre Chill"]
type = "MonitoredManualControl"
allowed_actuators = [
    "lox_fll_vlv", # LOX fill valve
    "lox_bld_vlv", # LOX bleed valve
    "n2_shw_vlv",  # N2 shower valves
]
telemetry_loss_threshold_sec = 300 # 5min
on_violation = "Filling Abort"
manual_transitions = [
    { target = "Pre Filling", display = "Start Filling" },
    { target = "Filling Abort", display = "Abort Filling", abort = true },
]

# This instantaeous state resets the lox fill and bleed valve to normal before proceeding.
[state_machine.states."Pre Filling"]
type = "SetNormalState" # Everything else is already normal
on_done = "Filling"

# A state where lox filling can start, and manual n2 filling preparations are also allowed.
[state_machine.states."Filling"]
type = "MonitoredManualControl"
allowed_actuators = [
    "lox_fll_vlv",  # LOX fill valve
    "lox_bld_vlv",  # LOX bleed valve
    "n2_fll_vlv",   # N2 fill valve
    "n2_bld_vlv",   # N2 bleed valve
    "n2_bst_vlv",   # N2/pneumatic booster valve
    "oss_ml_vlv",   # rocket LOX(OSS) main valve
    "prz_copv_vnt", # rocket N2(PRZ) vent valve
    "n2_shw_vlv",   # N2 shower valves
]
telemetry_loss_threshold_sec = 900 # 15min
on_violation = "Filling Abort"
manual_transitions = [
    { target = "Parallel Filling", display = "Start Seq" },
    { target = "LOX Filling", display = "Skip Seq" },
    { target = "Filling Abort", display = "Abort Filling", abort = true },
]

# A state where lox filling can continue, and the n2 sequence is being run.
[state_machine.states."Parallel Filling"]
type = "RunSeqWithControl"
allowed_actuators = [
    "lox_fll_vlv", # LOX fill valve
    "lox_bld_vlv", # LOX bleed valve
    "oss_ml_vlv",  # rocket LOX(OSS) main valve
    "n2_shw_vlv",  # N2 shower valves
]
telemetry_loss_threshold_sec = 900 # 15min
on_violation = "Filling Abort"
on_completed = "LOX Filling"
on_sequence_problem = "Filling"
manual_transitions = [
    { target = "Filling", display = "Cancel Seq" },
    { target = "Filling Abort", display = "Abort Filling", abort = true },
]

# Close vent valves
[[state_machine.states."Parallel Filling".sequence]]
action = "SetActuators"
targets = { "n2_bld_vlv" = "Close", "prz_copv_vnt" = "Close" }
[[state_machine.states."Parallel Filling".sequence]]
action = "Wait"
duration_sec = 0.4
# Then open N2 fill valve
[[state_machine.states."Parallel Filling".sequence]]
action = "SetActuators"
targets = { "n2_fll_vlv" = "Open" }
# Detect proper opening, analogous to `n2_tank_pressure.detect(value=30, rising=true, abort=ign_abort, patience=5s);`
[[state_machine.states."Parallel Filling".sequence]]
action = "N2FillDetection"
pressure_lower_thresh_barg = 30.0
patience_sec = 5.0
# Then open booster valve
[[state_machine.states."Parallel Filling".sequence]]
action = "SetActuators"
targets = { "n2_bst_vlv" = "Open" }
# And wait for filling to 300 bar
[[state_machine.states."Parallel Filling".sequence]]
action = "N2FillDetection"
pressure_lower_thresh_barg = 320.0
patience_sec = 3600                # 1h
# Finnally close the booster and fill valve again
[[state_machine.states."Parallel Filling".sequence]]
action = "SetActuators"
targets = { "n2_bst_vlv" = "Close", "n2_fll_vlv" = "Close" }

# A state where lox filling can continue, and n2 is locked.
[state_machine.states."LOX Filling"]
type = "MonitoredManualControl"
allowed_actuators = [
    "lox_fll_vlv", # LOX fill valve
    "lox_bld_vlv", # LOX bleed valve
    "oss_ml_vlv",  # rocket LOX(OSS) main valve
    "n2_shw_vlv",  # N2 shower valves
    "n2_bld_vlv",  # N2 bleed valve
]
telemetry_loss_threshold_sec = 900 # 15min
on_violation = "Filling Abort"
manual_transitions = [
    { target = "Filling", display = "Reset Seq" },
    { target = "Set Known State", display = "Decouple" },
    { target = "Filling Abort", display = "Abort Filling", abort = true },
]

# An instantaneous state to set a decouple ready state
[state_machine.states."Set Known State"]
type = "RunSequence"
on_completed = "Decouple"
on_cancelled = "Decouple"
[[state_machine.states."Set Known State".sequence]]
action = "SetActuators"
[state_machine.states."Set Known State".sequence.targets]
# Off normal: oss & prz vent closed, lox bleed closed
prz_copv_vnt = "Close"
oss_tnk_vnt = "Close"
lox_bld_vlv = "Close"
n2_shw_vlv = "Open"
# Normal
lox_fll_vlv = "Close"
oss_ml_vlv = "Close"
n2_fll_vlv = "Close"
n2_bld_vlv = "Open"
n2_bst_vlv = "Close"

# State to try to decouple the hoses
[state_machine.states."Decouple"]
type = "ManualControl"
allowed_actuators = [
    "lox_dec_ext", # LOX decoupler
    "lox_dec_ret", # LOX decoupler
    "n2_dec_ext",  # N2 decoupler
    "n2_dec_ret",  # N2 decoupler
    "lox_bld_vlv", # LOX bleed valve
    "n2_bld_vlv",  # N2 bleed valve
    "n2_shw_vlv",  # N2 shower valves
]
manual_transitions = [
    { target = "Handsoff", display = "Decoupled" },
    { target = "Filling Abort", display = "Abort Filling", abort = true },
]


# ======================================= Ignition =======================================

# Abort State during ignition
[state_machine.states."Abort Firing"]
type = "DisarmIgniter"
on_done = "Abort Firing 2"
[state_machine.states."Abort Firing 2"]
type = "SetNormalState"
on_done = "Abort Firing 3"
[state_machine.states."Abort Firing 3"]
type = "Waiting"
manual_transitions = [{ target = "Safeing Normal", display = "Start Safing" }]

# Waiting state which waits for rocket pressurization and arming
[state_machine.states."Handsoff"]
type = "Waiting"
manual_transitions = [
    { target = "Armed", display = "Arm" },
    { target = "Decouple", display = "Revert" },
    { target = "Abort Firing", display = "Force Abort", abort = true },
]

# State to acknowledge that the RFS wasn't ready for ignition
[state_machine.states."Auto-Disarmed"]
type = "DisarmIgniter"
on_done = "Auto-Disarmed 2"
[state_machine.states."Auto-Disarmed 2"]
type = "Waiting"
manual_transitions = [{ target = "Handsoff", display = "Acknowledge" }]


# State which allows the ECU to ignite.
[state_machine.states."Armed"]
type = "WaitForIgnition"
on_ignition = "Ignition"
on_not_ready = "Auto-Disarmed"
allowed_actuators = [
    "gox_prg_vlv", # GOx purge valve
    "h2_prg_vlv",  # H2 purge valve
]
manual_transitions = [
    { target = "Abort Firing", display = "Force Abort", abort = true },
]

# State waits until the igniter can be shut off
[state_machine.states."Ignition"]
type = "AwaitTimer"
duration_sec = 6.0
on_timer = "Shutoff"
manual_transitions = [
    { target = "Abort Firing", display = "Force Abort", abort = true },
]

# Shutting off the igniter, after the rocket hopefully lifted off
[state_machine.states."Shutoff"]
type = "DisarmIgniter"
on_done = "Shutoff 2"
[state_machine.states."Shutoff 2"]
type = "RunSequence"
on_completed = "Safeing Normal"
on_cancelled = "Safeing Normal"
[[state_machine.states."Shutoff 2".sequence]]
action = "SetActuators"
targets = { "lox_prg_vlv" = "Open", "h2_bld_vlv" = "Open" }

# This state is compose of 3 substates and sets the system in a known state before manual safeing
[state_machine.states."Safeing Normal"]
type = "SetNormalState"
on_done = "Safeing Normal 2"
[state_machine.states."Safeing Normal 2"]
type = "Waiting"
manual_transitions = [{ target = "Safeing Idle", display = "Idle" }]

# This state allows no valve control during human interactions.
[state_machine.states."Safeing Idle"]
type = "Waiting"
manual_transitions = [
    { target = "Safeing Normal", display = "Normal" },
    { target = "Safeing Controllable", display = "Unlock" },
]

# This state allows full valve control of all RFS actuators for safeing purposes.
[state_machine.states."Safeing Controllable"]
type = "ManualControl"
allowed_actuators = [
    "lox_fll_vlv", # LOx fill valve
    "gox_prg_vlv", # GOx purge valve
    "h2_prg_vlv",  # H2 purge valve
    "n2_bld_vlv",  # N2 bleed valve
    "lox_prg_vlv", # LOx purge valve
    "gox_bld_vlv", # GOx bleed valve
    "n2_prg_vlv",  # N2 purge valve
    "n2_fll_vlv",  # N2 fill valve
    "h2_bld_vlv",  # H2 bleed valve
    "lox_bld_vlv", # LOx bleed valve
    "n2_bst_vlv",  # Booster valve
    "lox_dec_ext", # LOX decoupler
    "lox_dec_ret", # LOX decoupler
    "n2_dec_ext",  # N2 decoupler
    "n2_dec_ret",  # N2 decoupler
    "n2_shw_vlv",  # N2 shower valves
    "h2_ign_vlv",  # H2 igniter valve
    "gox_ign_vlv", # GOx igniter valve
    "ign_spk_plg", # Igniter spark
]
manual_transitions = [
    { target = "Safeing Idle", display = "Lock" },
    { target = "Safeing Normal", display = "Normal", abort = true },
]
