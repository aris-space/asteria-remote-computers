# The RFSC flight state machine

# ======================================= System Configuration =======================================
system_time_rate_hz = 200
[telemetry]
mavlink_address = "127.0.0.1:5761"
always_allowed_actuators = [
    "maxon_board_power",
    "rocket_power",
    "rocket_heating",
    "custom1",
    "custom2",
    "custom3",
]
[uremote]
address = "192.168.0.222:502"
min_read_frequency_hz = 20
[serial]
serial_port = "/dev/ttyAMA2"
baud_rate = "Baud115200"
timeout_ms = 105
pressure_polling_hz = 20
valve_state_polling_hz = 5
[can]
socket_address = "can0"
[controllino]
address = "192.168.0.227:502"
request_timeout_secs = 0.1
pressure_polling_hz = 40.0
temperature_polling_hz = 5.0
digital_polling_hz = 10.0
actuator_polling_hz = 10.0


# ======================================= System Test =======================================
[state_machine]
name = "Flight State machine, Dry Run"
initial_state = "Idle"

# Path in the repo to the state machine diagram to be used by mission control.
diagram_path = "state-machines/rfs-flight-state-machine.drawio.svg"

# Initial state which does nothing
[state_machine.states."Idle"]
type = "Waiting"
manual_transitions = [
    "Diagnostics",
    "System Normal", # Should only be used carefully
]

# This state exists for acknowledging diagnostic failures
[state_machine.states."Soft Failure"]
type = "Waiting"
manual_transitions = ["Idle"]

# This state only lets the SM pass on if all sensors are reading good values
[state_machine.states."Diagnostics"]
type = "DiagnosticsGate"
on_tests_pass = "System Normal"
on_tests_fail = "Soft Failure"

# Abort state during system testing, which sets all (but the lox bleed) valves in a normal state, designed to depressurize the system.
[state_machine.states."Safe Abort"]
type = "DepressurizeRFS"
on_done = "Safe Abort 2"
[state_machine.states."Safe Abort 2"]
type = "Waiting"
manual_transitions = ["System Normal"]

# This state sets the system in a known state before waiting
[state_machine.states."System Normal"]
type = "SetNormalState"
include_pss = false
on_done = "System Normal 2"
[state_machine.states."System Normal 2"]
type = "Waiting"
manual_transitions = [
    "System Idle",
    "Rocket Diagnostics",
    "Waiting for Filling",                   # Skip diagnostics
    { target = "Safe Abort", abort = true },
]

# This state allows no valve control during human interactions.
[state_machine.states."System Idle"]
type = "Waiting"
manual_transitions = [
    "System Normal",
    "System Controllable",
    { target = "Safe Abort", abort = true },
]

# This state allows full valve control of all RFS actuators for testing procedures.
[state_machine.states."System Controllable"]
type = "ManualControl"
allowed_actuators = [
    "lox_fll_vlv", # LOx fill valve
    "gox_prg_vlv", # GOx purge valve
    "h2_prg_vlv",  # H2 purge valve
    "n2_bld_vlv",  # N2 bleed valve
    "lox_prg_vlv", # LOx purge valve
    "gox_bld_vlv", # GOx bleed valve
    "n2_prg_vlv",  # N2 purge valve
    "n2_fll_vlv",  # N2 fill valve
    "h2_bld_vlv",  # H2 bleed valve
    "lox_bld_vlv", # LOx bleed valve
    "n2_bst_vlv",  # Booster valve
    "lox_dec_ext", # LOX decoupler
    "lox_dec_ret", # LOX decoupler
    "n2_dec_ext",  # N2 decoupler
    "n2_dec_ret",  # N2 decoupler
    "n2_shw_vlv",  # N2 shower valves
    "eng_prg_vlv", # Engine Purge valve
    "h2_ign_vlv",  # H2 igniter valve
    "gox_ign_vlv", # GOx igniter valve
    "ign_spk_plg", # Igniter spark
]
manual_transitions = [
    "System Idle",
    "Igniter Test",
    "Igniter Deactivation",
    { target = "Safe Abort", abort = true },
]

# This state runs the igniter deactivation/purge sequence to safely depressurize the igniter.
[state_machine.states."Igniter Deactivation"]
type = "RunSequence"
on_completed = "System Controllable"
manual_transitions = [{ target = "Safe Abort", abort = true }]
sequence = """
# Preconditions:
# H2 and GOx Bottle closed

# Clear leftover H2
h2_ign_vlv.open();
sys.wait(time=0.5s);

# Purge through bleed
h2_prg_vlv.open();
sys.wait(time=1s);
h2_bld_vlv.close();

# Purge through igniter
sys.wait(time=5s);
h2_prg_vlv.close();

# open H2 bleed again
h2_bld_vlv.open();

# Same for GOx side
# Clear leftover GOx
gox_ign_vlv.open();
sys.wait(time=0.5s);

# Purge through bleed
gox_prg_vlv.open();
sys.wait(time=1s);
gox_bld_vlv.close();

# Purge through igniter
sys.wait(time=5s);
gox_prg_vlv.close();

# open GOx bleed again
gox_bld_vlv.open();
sys.wait(time=2s);

# finally close h2 and gox igniter valves again
h2_ign_vlv.close();
gox_ign_vlv.close();

# Post-Conditions:
# Igniter Fully Depressurized
# All Igniter Valves Normal State
"""

# This state runs the igniter test sequence to test ignition.
[state_machine.states."Igniter Test"]
type = "RunSequence"
on_completed = "System Controllable"
manual_transitions = [{ target = "Abort Ign Test", abort = true }]
sequence = """
# Watch thresholds for the whole duration of the sequence.
gox_line_p.watch(max=15, abort='Abort Ign Test');
h2_line_p.watch(max=15, abort='Abort Ign Test');
ign_cc_p.watch(max=10, abort='Abort Ign Test');
ign_cc_t.watch(max=200, abort='Abort Ign Test');

# Start purging
gox_prg_vlv.open();
h2_prg_vlv.open();
sys.wait(time=5s);

# Stop purging and start spark plug
gox_prg_vlv.close();
h2_prg_vlv.close();
ign_spk_plg.open();
sys.wait(time=0.5s);

# First open GOX then H2 valve
gox_ign_vlv.open();
sys.wait(time=0.5s);
h2_ign_vlv.open();

# Detect firing
ign_cc_p.detect(value=4.5, rising=true, abort='Abort Ign Test', patience=3s);

# Sustain firing, abort if pressure becomes too low
ign_cc_p.watch(min=4, abort='Abort Ign Test', key=sustain);
sys.wait(time=4s);
ign_cc_p.ignore(key=sustain);

# After ignition purge sequence:
h2_ign_vlv.close();
sys.wait(time=0.5s);
gox_ign_vlv.close();
gox_prg_vlv.open();
h2_prg_vlv.open();
sys.wait(time=0.5s);

ign_spk_plg.close();
sys.wait(time=5s);

gox_prg_vlv.close();
h2_prg_vlv.close();
"""

# This runs the ignition abort sequence in case a manual or automatic abort was triggered
[state_machine.states."Abort Ign Test"]
type = "RunSequence"
on_completed = "Safe Abort"
manual_transitions = [{ target = "Safe Abort", abort = true }]
sequence = """
# Open purge valves and close fuel valve
h2_ign_vlv.close();
gox_ign_vlv.close();
gox_prg_vlv.open();
h2_prg_vlv.open();
sys.wait(time=0.5s);

# 0.5s later turn off spark plug
ign_spk_plg.close();

# Now purge for 5 sec and then closed the purge valves again
sys.wait(time=5s);
gox_prg_vlv.close();
h2_prg_vlv.close();
"""

# ======================================= Pre Filling =======================================

# Abort state before ethanol filling, which sets all valves in a normal state
[state_machine.states."Pre Filling Abort"]
type = "SetNormalState"
include_pss = true
on_done = "Pre Filling Abort 2"
[state_machine.states."Pre Filling Abort 2"]
type = "Waiting"
manual_transitions = ["Rocket Diagnostics", "PreF Abort Overrides"]

# This state allows full actuators control during safing operations in an abort scenario
[state_machine.states."PreF Abort Overrides"]
type = "ManualControl"
allowed_actuators = [
    "lox_fll_vlv",
    "gox_prg_vlv",
    "h2_prg_vlv",
    "n2_bld_vlv",
    "lox_prg_vlv",
    "gox_bld_vlv",
    "n2_prg_vlv",
    "n2_fll_vlv",
    "h2_bld_vlv",
    "lox_bld_vlv",
    "n2_bst_vlv",
    "lox_dec_ext",
    "lox_dec_ret",
    "n2_dec_ext",
    "n2_dec_ret",
    "n2_shw_vlv",
    "eng_prg_vlv",
    "h2_ign_vlv",
    "gox_ign_vlv",
    "ign_spk_plg",
    "prz_copv_vnt",
    "prz_fss_dpr",
    "fss_tnk_vnt",
    "prz_oss_dpr",
    "oss_tnk_vnt",
    "fss_ml_vlv",
    "oss_ml_vlv",
]
manual_transitions = ["Pre Filling Abort"]

# This state only lets the SM pass on if all boards in the rocket are healthy
[state_machine.states."Rocket Diagnostics"]
type = "PSSDiagnosticsGate"
outdated_threshold_sec = 5
on_tests_pass = "Waiting for Filling"
on_tests_fail = "Rocket Unhealthy"

# This state lets the operator acknowledge that the connection to the rocket is unhealthy
[state_machine.states."Rocket Unhealthy"]
type = "Waiting"
manual_transitions = [
    "System Normal",
    { target = "Pre Filling Abort", abort = true },
]


# This waiting state leaves the RFS to be while the rocket is erected and until we are GO for filling.
[state_machine.states."Waiting for Filling"]
type = "SetNormalState"
include_pss = true
on_done = "Waiting for Filling 2"
[state_machine.states."Waiting for Filling 2"]
type = "Waiting"
manual_transitions = [
    "Purge",
    "Activation",
    { target = "Pre Filling Abort", abort = true },
]


# This state runs the rocket purge sequence before filling.
[state_machine.states."Purge"]
type = "RunSequence"
on_completed = "Purge 2"
manual_transitions = [{ target = "Pre Filling Abort", abort = true }]
sequence = """
# Close n2 bleed, open n2 purge. Prz Vent and Fuel prz are already open/closed respectively.
n2_bld_vlv.close();
n2_prg_vlv.open();
prz_copv_vnt.open();
prz_fss_dpr.deactivate();
# Purge pressure tank for 5 sec
sys.wait(time=5s);

# Open fuel prz valve and close prz Vent.
prz_copv_vnt.close();
fss_tnk_vnt.open();
prz_fss_dpr.activate(setpoint=10.0);
# Purge fuel tank for 10 sec
sys.wait(time=10s);

# Close fuel vent and open main valve fully
fss_tnk_vnt.close();
fss_ml_vlv.open();
# Purge fuel line for 5 sec
sys.wait(time=5s);

# Close FSS prz valve, but open OSS one.
prz_fss_dpr.deactivate();
prz_oss_dpr.activate(setpoint=10.0);
oss_tnk_vnt.open();
# Purge oxidizer tank for 10 sec
sys.wait(time=10s);

# Close OSS Vent and open main
oss_tnk_vnt.close();
oss_ml_vlv.open();
# Purge through OSS Main
sys.wait(time=5s);
"""
# Close n2 purge, open oss tank and reset rest to normal.
[state_machine.states."Purge 2"]
type = "SetNormalState"
include_pss = true
on_done = "Purge 3"
[state_machine.states."Purge 3"]
type = "RunSequence"
on_completed = "Purge 4"
manual_transitions = [{ target = "Pre Filling Abort", abort = true }]
sequence = """
# Normal state (which it should already be)
n2_prg_vlv.close();
prz_oss_dpr.deactivate();
prz_copv_vnt.open();
fss_tnk_vnt.open();
n2_bld_vlv.open();
fss_ml_vlv.close();
sys.wait(time=0.4s);

# Now open lox purge
lox_prg_vlv.open();
# Purge lox decoupler line for 10 sec
sys.wait(time=10s);

# Now open bleed
lox_bld_vlv.open();
# Purge through bleed for 5 sec
sys.wait(time=5s);

# Close lox bleed, open lox fill valve to 100%
lox_bld_vlv.close();
lox_fll_vlv.open();
# Purge dewar flex pipe for 5 sec
sys.wait(time=5s);

# Reset back to normal
oss_tnk_vnt.open();
lox_prg_vlv.close();
lox_fll_vlv.close();
"""
[state_machine.states."Purge 4"]
type = "SetNormalState"
include_pss = true
on_done = "Waiting for Filling"

# ======================================= Filling =======================================

# Abort state during filling, sets everything normal.
[state_machine.states."Filling Abort"]
type = "SetNormalState"
include_pss = true
on_done = "Filling Abort 2"
[state_machine.states."Filling Abort 2"]
type = "Waiting"
manual_transitions = ["Abort Overrides", "Activation"]

# This state allows full actuators control during safing operations in an abort scenario
[state_machine.states."Abort Overrides"]
type = "ManualControl"
allowed_actuators = [
    "lox_fll_vlv",
    "gox_prg_vlv",
    "h2_prg_vlv",
    "n2_bld_vlv",
    "lox_prg_vlv",
    "gox_bld_vlv",
    "n2_prg_vlv",
    "n2_fll_vlv",
    "h2_bld_vlv",
    "lox_bld_vlv",
    "n2_bst_vlv",
    "lox_dec_ext",
    "lox_dec_ret",
    "n2_dec_ext",
    "n2_dec_ret",
    "n2_shw_vlv",
    "eng_prg_vlv",
    "h2_ign_vlv",
    "gox_ign_vlv",
    "ign_spk_plg",
    "prz_copv_vnt",
    "prz_fss_dpr",
    "fss_tnk_vnt",
    "prz_oss_dpr",
    "oss_tnk_vnt",
    "fss_ml_vlv",
    "oss_ml_vlv",
]
manual_transitions = ["Filling Abort"]

# A state for activating everything that is needed to connect the dewar and decouplers, before filling.
[state_machine.states."Activation"]
type = "MonitoredManualControl"
allowed_actuators = [
    "lox_fll_vlv", # LOX fill valve
    "lox_bld_vlv", # LOX bleed valve
    "oss_tnk_vnt", # LOX tank vent valve
    "lox_prg_vlv", # LOX purge valve
    "lox_dec_ext", # LOX decoupler
    "lox_dec_ret", # LOX decoupler
    "n2_dec_ext",  # N2 decoupler
    "n2_dec_ret",  # N2 decoupler
    "n2_prg_vlv",  # N2 purge valve
    "n2_shw_vlv",  # N2 shower valves
    "eng_prg_vlv", # Engine Purge valve
]
telemetry_loss_threshold_sec = 600 # 10min
on_violation = "Filling Abort"
manual_transitions = ["Pre Filling", { target = "Filling Abort", abort = true }]

# This instantaneous state resets all valves to normal before proceeding.
[state_machine.states."Pre Filling"]
type = "SetNormalState"
include_pss = true
on_done = "Filling"

# A state where LOX, ethanol and N2 filling can be done manually.
[state_machine.states."Filling"]
type = "MonitoredManualControl"
allowed_actuators = [
    "lox_fll_vlv",  # LOX fill valve
    "lox_bld_vlv",  # LOX bleed valve
    "oss_ml_vlv",   # rocket LOX(OSS) main valve
    "oss_tnk_vnt",  # rocket LOX(OSS) vent valve
    "prz_oss_dpr",  # rocket LOX(OSS) DPR valve
    "lox_dec_ext",  # LOX decoupler extend valve
    "fss_tnk_vnt",  # rocket ethanol(FSS) vent valve
    "prz_fss_dpr",  # rocket ethanol(FSS) DPR valve
    "n2_fll_vlv",   # N2 fill valve
    "n2_bld_vlv",   # N2 bleed valve
    "n2_bst_vlv",   # N2/pneumatic booster valve
    "prz_copv_vnt", # rocket N2(PRZ) vent valve
    "n2_shw_vlv",   # N2 shower valves
]
telemetry_loss_threshold_sec = 600 # 10min
on_violation = "Filling Abort"
manual_transitions = [
    "Parallel Filling",
    "Set Ready State",
    { target = "Filling Abort", abort = true },
]

# A state where LOX filling can continue, and the n2 sequence is being run.
[state_machine.states."Parallel Filling"]
type = "RunSeqWithControl"
allowed_actuators = [
    "lox_fll_vlv", # LOX fill valve
    "lox_bld_vlv", # LOX bleed valve
    "oss_ml_vlv",  # rocket LOX(OSS) main valve
    "n2_shw_vlv",  # N2 shower valves
]
telemetry_loss_threshold_sec = 600 # 10min
on_violation = "Filling Abort"
on_completed = "Filling"
manual_transitions = ["Filling", { target = "Filling Abort", abort = true }]
sequence = """
# Pre-Conditions:
# LOx being Filled, everything depressurized

# Close vent valves
n2_bld_vlv.close();
prz_copv_vnt.close();

# Close fuel vent and open fuel dpr
fss_tnk_vnt.close();
prz_fss_dpr.activate(setpoint=50.0);
sys.wait(time=0.4s);

# Then open N2 fill valve
n2_fll_vlv.open();

# Detect copv pressure increase above 50 barg, meaning fuel tank was filled
fss_tnk_p_flt.detect(value=50, rising=true, abort='Filling', patience=15s);

# close fss dpr
prz_fss_dpr.deactivate();

# Then open booster valve
n2_bst_vlv.open();

# And wait for filling to 320 bar post-booster
n2_post_bst_p.detect(value=320, rising=true, abort='Filling', patience=3600s);

# Finally close the booster and fill valve again
n2_bst_vlv.close();
n2_fll_vlv.close();
"""

# An instantaneous state to set a decouple ready state
[state_machine.states."Set Ready State"]
type = "RunSequence"
on_completed = "Decouple"
sequence = """
# Off normal: rocket vents closed
prz_copv_vnt.close();
oss_tnk_vnt.close();
fss_tnk_vnt.close();
n2_shw_vlv.open();
# Normal
lox_bld_vlv.close();
lox_fll_vlv.close();
oss_ml_vlv.close();
n2_fll_vlv.close();
n2_bld_vlv.open();
n2_bst_vlv.close();
eng_prg_vlv.close();
"""

# State to try to decouple the hoses
[state_machine.states."Decouple"]
type = "MonitoredManualControl"
allowed_actuators = [
    "lox_dec_ext", # LOX decoupler
    "lox_dec_ret", # LOX decoupler
    "n2_dec_ext",  # N2 decoupler
    "n2_dec_ret",  # N2 decoupler
    "lox_bld_vlv", # LOX bleed valve
    "n2_bld_vlv",  # N2 bleed valve
    "n2_shw_vlv",  # N2 shower valves
    "eng_prg_vlv", # Engine Purge valve
]
telemetry_loss_threshold_sec = 600 # 10min
on_violation = "Filling Abort"
manual_transitions = ["Handsoff", { target = "Filling Abort", abort = true }]


# ======================================= Ignition =======================================

# Abort State during ignition
[state_machine.states."Abort Firing"]
type = "DisarmIgniter"
on_done = "Abort Firing 2"
[state_machine.states."Abort Firing 2"]
type = "SetNormalState"
include_pss = false
on_done = "Abort Firing 3"
# Opens the purge valves
[state_machine.states."Abort Firing 3"]
type = "RunSequence"
on_completed = "Abort Firing 4"
sequence = """
eng_prg_vlv.open();
gox_prg_vlv.open();
h2_prg_vlv.open();
"""
[state_machine.states."Abort Firing 4"]
type = "Waiting"
manual_transitions = ["Safeing Normal"]

# Waiting state which waits for rocket pressurization and arming
[state_machine.states."Handsoff"]
type = "DisarmIgniter"
on_done = "Handsoff 2"
[state_machine.states."Handsoff 2"]
type = "RunSequence"
on_completed = "Handsoff 3"
sequence = """
# Ignition system to normal state
gox_prg_vlv.close();
gox_ign_vlv.close();
gox_bld_vlv.open();
h2_prg_vlv.close();
h2_ign_vlv.close();
h2_bld_vlv.open();
ign_spk_plg.close();
"""
[state_machine.states."Handsoff 3"]
type = "ManualControl"
allowed_actuators = [
    "n2_bld_vlv", # N2 bleed valve
    "n2_fll_vlv", # N2 fill valve
    "n2_bst_vlv", # Booster valve
]
manual_transitions = [
    "Armed",
    "Decouple",
    { target = "Abort Firing", abort = true },
]

# State to acknowledge that the RFS wasn't ready for ignition
[state_machine.states."Auto-Disarmed"]
type = "DisarmIgniter"
on_done = "Auto-Disarmed 2"
[state_machine.states."Auto-Disarmed 2"]
type = "RunSequence"
on_completed = "Auto-Disarmed 3"
sequence = """
# Ignition system to normal state
gox_prg_vlv.close();
gox_ign_vlv.close();
gox_bld_vlv.open();
h2_prg_vlv.close();
h2_ign_vlv.close();
h2_bld_vlv.open();
ign_spk_plg.close();
"""
[state_machine.states."Auto-Disarmed 3"]
type = "Waiting"
manual_transitions = ["Handsoff", { target = "Abort Firing", abort = true }]


# State which allows the FC to ignite.
[state_machine.states."Armed"]
type = "RunSequence"
on_completed = "Armed 2"
sequence = """
# Purge ignition system
h2_bld_vlv.close();
gox_bld_vlv.close();
gox_prg_vlv.open();
h2_prg_vlv.open();
"""
[state_machine.states."Armed 2"]
type = "WaitForIgnition"
on_ignition = "Ignition"
on_not_ready = "Auto-Disarmed"
manual_transitions = ["Handsoff", { target = "Abort Firing", abort = true }]

# State waits until the igniter can be shut off
[state_machine.states."Ignition"]
type = "AwaitTimer"
duration_sec = 4.0
on_timer = "Shutoff"
manual_transitions = [{ target = "Abort Firing", abort = true }]

# Shutting off the igniter, after the rocket hopefully lifted off
[state_machine.states."Shutoff"]
type = "DisarmIgniter"
on_done = "Shutoff 2"
[state_machine.states."Shutoff 2"]
type = "RunSequence"
on_completed = "Wait for Completion"
sequence = """
# Open purge valves and close igniter valves
h2_ign_vlv.close();
gox_ign_vlv.close();
gox_prg_vlv.open();
h2_prg_vlv.open();
sys.wait(time=0.5s);
# 0.5s later turn off spark plug
ign_spk_plg.close();
"""

# Waiting state until we want to stop purging
[state_machine.states."Wait for Completion"]
type = "Waiting"
manual_transitions = ["Safeing Normal"]

# This state sets the system in a known state before manual safeing
[state_machine.states."Safeing Normal"]
type = "SetNormalState"
include_pss = false
on_done = "Safeing Normal 2"
[state_machine.states."Safeing Normal 2"]
type = "Waiting"
manual_transitions = ["Safeing Idle"]

# This state allows no valve control during human interactions.
[state_machine.states."Safeing Idle"]
type = "Waiting"
manual_transitions = ["Safeing Normal", "Safeing Controllable"]

# This state allows full valve control of all RFS actuators for safeing purposes.
[state_machine.states."Safeing Controllable"]
type = "ManualControl"
allowed_actuators = [
    "lox_fll_vlv", # LOx fill valve
    "gox_prg_vlv", # GOx purge valve
    "h2_prg_vlv",  # H2 purge valve
    "n2_bld_vlv",  # N2 bleed valve
    "lox_prg_vlv", # LOx purge valve
    "gox_bld_vlv", # GOx bleed valve
    "n2_prg_vlv",  # N2 purge valve
    "n2_fll_vlv",  # N2 fill valve
    "h2_bld_vlv",  # H2 bleed valve
    "lox_bld_vlv", # LOx bleed valve
    "n2_bst_vlv",  # Booster valve
    "lox_dec_ext", # LOX decoupler
    "lox_dec_ret", # LOX decoupler
    "n2_dec_ext",  # N2 decoupler
    "n2_dec_ret",  # N2 decoupler
    "n2_shw_vlv",  # N2 shower valves
    "eng_prg_vlv", # Engine Purge valve
    "h2_ign_vlv",  # H2 igniter valve
    "gox_ign_vlv", # GOx igniter valve
    "ign_spk_plg", # Igniter spark
]
manual_transitions = [
    "Safeing Idle",
    "Igniter Deactivation S",
    { target = "Safeing Normal", abort = true },
]

# This state runs the igniter deactivation/purge sequence to safely depressurize the igniter.
[state_machine.states."Igniter Deactivation S"]
type = "RunSequence"
on_completed = "Safeing Controllable"
manual_transitions = [{ target = "Safeing Normal", abort = true }]
sequence = """
# Preconditions:
# H2 and GOx Bottle closed

# Clear leftover H2
h2_ign_vlv.open();
sys.wait(time=0.5s);

# Purge through bleed
h2_prg_vlv.open();
sys.wait(time=1s);
h2_bld_vlv.close();

# Purge through igniter
sys.wait(time=5s);
h2_prg_vlv.close();

# open H2 bleed again
h2_bld_vlv.open();

# Same for GOx side
# Clear leftover GOx
gox_ign_vlv.open();
sys.wait(time=0.5s);

# Purge through bleed
gox_prg_vlv.open();
sys.wait(time=1s);
gox_bld_vlv.close();

# Purge through igniter
sys.wait(time=5s);
gox_prg_vlv.close();

# open GOx bleed again
gox_bld_vlv.open();
sys.wait(time=2s);

# finally close h2 and gox igniter valves again
h2_ign_vlv.close();
gox_ign_vlv.close();

# Post-Conditions:
# Igniter Fully Depressurized
# All Igniter Valves Normal State
"""
