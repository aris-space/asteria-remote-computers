[General]

# Enable forwarding between endpoints (can probably be removed, since it should be true per default)
Forwarding = True

TcpServerPort = 5760

# -------------------------------------
# UDP ENDPOINT DEFINITIONS
# -------------------------------------

# Endpoint for the rfs computer connection
[UdpEndpoint rfs_computer]
Mode = Server
Address = 127.0.0.1
Port = 5761

# Endpoint for the old mission control mavlink router connection via UDP
[UdpEndpoint mission_control]
Mode = Server
Address = 0.0.0.0
Port = 5001
